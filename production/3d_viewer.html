<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarlls IoT Smart Switch - 3D View</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a1a;
      color: #e2e2e2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      text-align: center;
      padding: 24px 16px 8px;
    }
    header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    header p {
      font-size: 14px;
      color: #888;
    }
    .viewer-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      min-height: 500px;
    }
    model-viewer {
      width: 100%;
      max-width: 800px;
      height: 70vh;
      min-height: 400px;
      border-radius: 16px;
      background: #111122;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      --poster-color: #111122;
    }
    .specs {
      display: flex;
      justify-content: center;
      gap: 32px;
      padding: 16px;
      flex-wrap: wrap;
    }
    .spec {
      text-align: center;
    }
    .spec-value {
      font-size: 20px;
      font-weight: 700;
      color: #4CAF50;
    }
    .spec-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #444;
    }
    .hint {
      text-align: center;
      font-size: 13px;
      color: #555;
      padding-bottom: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sarlls IoT Smart Switch v1.5</h1>
    <p>ESP32 WiFi/BLE Relay Controller</p>
  </header>

  <div class="viewer-container">
    <model-viewer
      src="ESP32_Simple_IoT_3D.glb?v=20260609b"
      alt="Sarlls IoT Smart Switch PCB - 3D Model"
      auto-rotate
      auto-rotate-delay="1000"
      rotation-per-second="20deg"
      camera-controls
      camera-orbit="270deg 72deg auto"
      min-camera-orbit="auto auto 5%"
      max-camera-orbit="auto auto 300%"
      touch-action="pan-y"
      interaction-prompt="auto"
      shadow-intensity="1"
      exposure="1.2"
      environment-image="neutral"
    ></model-viewer>
  </div>

  <p class="hint">Drag to rotate &bull; Pinch to zoom &bull; Right-click to pan</p>

  <div class="specs">
    <div class="spec">
      <div class="spec-value">80 x 60mm</div>
      <div class="spec-label">Board Size</div>
    </div>
    <div class="spec">
      <div class="spec-value">ESP32</div>
      <div class="spec-label">WiFi + BLE</div>
    </div>
    <div class="spec">
      <div class="spec-value">10A / 250V</div>
      <div class="spec-label">Relay Rating</div>
    </div>
    <div class="spec">
      <div class="spec-value">USB-C</div>
      <div class="spec-label">Power Input</div>
    </div>
  </div>

  <footer>
    Strickland Technology &bull; Prototype Rev 1.5 &bull; 2026
  </footer>
</body>
</html>
